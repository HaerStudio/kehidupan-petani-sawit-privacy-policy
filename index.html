      h3: "3. In-App Purchases",

      p4: 'The game may offer in-app purchases, such as a remove-ads feature, if available. Transactions are processed through Google Play. The developer does not ask players to enter payment card details directly into the game. Transactions and payment information are handled under the <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Google Privacy Policy</a> and the <a href="https://play.google.com/about/play-terms/" target="_blank" rel="noopener noreferrer">Google Play Terms of Service</a>.',

      h4: "4. Information Collected by the Developer",

      p5: "The game currently does not provide player accounts or server-based game progress storage operated by the developer. Game progress is stored locally. However, third-party services such as Google AdMob may collect or process data as described in the advertising section above.",

      p6: "Because game progress is stored locally, you can delete local data by clearing the app data in your device settings or uninstalling the app. This may delete saved game progress. Data processed by third-party services is subject to those providers’ data handling policies and mechanisms.",

      h6: "6. Children’s Privacy",

      p7: "Kehidupan Petani Sawit is a non-violent farming simulation game intended for players aged 8 and older. Because children may play this game, the developer must set the appropriate target audience in Google Play Console and configure Google AdMob and third-party services in accordance with applicable Google Play Families and children’s policies. Where required, advertising settings must request the appropriate treatment for children, including Child-Directed Treatment (TFCD) or Tag for Under the Age of Consent (TFUA), as applicable. The developer must also use advertising settings appropriate for a child audience and must not knowingly request ads that are unsuitable for children or personalized ads where prohibited by applicable policies. The game does not ask children to submit personal information directly to the developer through an in-game account or form. However, Google AdMob and other third-party providers may still process data according to their service settings and policies. This statement describes practices that must be implemented and does not replace the obligation to actually configure the SDK, target audience, ads, and data practices in accordance with applicable requirements.",

  const elementIds = [
    "page-title", "subtitle", "updated-label", "updated-date",
    "intro", "consent",
    "h1", "p1", "h2", "p2", "p3", "h3", "p4",
    "h4", "p5", "h5", "p6", "h6", "p7",
    "h7", "p8", "h8", "p9",
    "developer-label", "game-label", "footer"
  ];

  const keyMap = {
    "page-title": "pageTitle",
    "updated-label": "updatedLabel",
    "updated-date": "updatedDate",
    "developer-label": "developerLabel",
    "game-label": "gameLabel"
  };

  function setLanguage(language) {
    const selected = translations[language] ? language : "id";
    const dictionary = translations[selected];

    elementIds.forEach(function (id) {
      const key = keyMap[id] || id;
      const element = document.getElementById(id);

      if (element && dictionary[key] !== undefined) {
        element.innerHTML = dictionary[key];
      }
    });

    document.documentElement.lang = selected;

    document.title = selected === "en"
      ? "Privacy Policy — Kehidupan Petani Sawit"
      : "Kebijakan Privasi — Kehidupan Petani Sawit";

    document.getElementById("btn-id").classList.toggle("active", selected === "id");
    document.getElementById("btn-en").classList.toggle("active", selected === "en");

    document.getElementById("btn-id").setAttribute(
      "aria-pressed",
      String(selected === "id")
    );

    document.getElementById("btn-en").setAttribute(
      "aria-pressed",
      String(selected === "en")
    );

    try {
      localStorage.setItem("haerPrivacyLanguage", selected);
    } catch (error) {
      // Bahasa tetap berfungsi jika localStorage tidak tersedia.
    }
  }

  document.getElementById("btn-id").addEventListener("click", function () {
    setLanguage("id");
  });

  document.getElementById("btn-en").addEventListener("click", function () {
    setLanguage("en");
  });

  let initialLanguage = "id";

  try {
    const savedLanguage = localStorage.getItem("haerPrivacyLanguage");

    if (savedLanguage === "id" || savedLanguage === "en") {
      initialLanguage = savedLanguage;
    }
  } catch (error) {
    // Gunakan bahasa Indonesia jika localStorage tidak tersedia.
  }

  setLanguage(initialLanguage);
})();
